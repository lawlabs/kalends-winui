name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Test layout engine
        run: dotnet test tests/Kalends.WinUI.Tests/Kalends.WinUI.Tests.csproj -c Release --nologo
      - name: Build library
        run: dotnet build src/Kalends.WinUI/Kalends.WinUI.csproj -c Release --nologo
      - name: Build sample
        # Compilation does not require the self-contained publish configuration used for trimming.
        run: dotnet build samples/Kalends.WinUI.Sample/Kalends.WinUI.Sample.csproj -c Release -p:Platform=x64 -p:PublishTrimmed=false --nologo
      - name: Pack
        run: dotnet pack src/Kalends.WinUI/Kalends.WinUI.csproj -c Release --nologo
